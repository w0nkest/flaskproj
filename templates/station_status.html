<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мониторинг остановки</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ccc; width: 350px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px inset #eee; }
        .label { font-weight: bold; color: #555; }
        .value { color: #000; }
        .status-on { color: green; font-weight: bold; }
        .btn-refresh { margin-top: 20px; width: 100%; padding: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        .btn-refresh:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Остановка: {{ data.location }}</h2>
        <div class="info-row">
            <span class="label">ID системы:</span>
            <span class="value">{{ data.station_id }}</span>
        </div>
        <div class="info-row">
            <span class="label">Статус:</span>
            <span class="value status-on">{{ data.status }}</span>
        </div>
        <div class="info-row">
            <span class="label">Время:</span>
            <span class="value">{{ data.sensors_data.clock.value }}</span>
        </div>
        <div class="info-row">
            <span class="label">Температура:</span>
            <span class="value">{{ data.sensors_data.temperature.value }}°C</span>
        </div>
        <button class="btn-refresh" onclick="location.reload()">Обновить данные</button>
    </div>
</body>
</html>
