<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>График температуры</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <a href="/status">← Назад к мониторингу</a>

    <h2>График изменения температуры</h2>
    <canvas id="temperatureChart" width="800" height="400"></canvas>

    <script>
        $(document).ready(function() {
            $.ajax({
                url: '/api/chart/temperature',
                method: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (response.labels && response.data) {
                        const ctx = document.getElementById('temperatureChart').getContext('2d');
                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: response.labels,
                                datasets: [{
                                    label: 'Температура (°C)',
                                    data: response.data
                                }]
                            },
                            options: {
                                scales: {
                                    y: {
                                        title: {
                                            display: true,
                                            text: 'Температура, °C'
                                        }
                                    },
                                    x: {
                                        title: {
                                            display: true,
                                            text: 'Время'
                                        }
                                    }
                                }
                            }
                        });
                    } else {
                        alert('Нет данных для отображения графика.');
                    }
                },
                error: function() {
                    alert('Ошибка загрузки данных с сервера.');
                }
            });
        });
    </script>
</body>
</html>
